<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion Architecture</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 900px; margin: 40px auto; padding: 0 24px; color: #1a1a1a; line-height: 1.6; }
    h1 { border-bottom: 2px solid #e1e4e8; padding-bottom: 12px; }
    h2 { border-bottom: 1px solid #e1e4e8; padding-bottom: 8px; margin-top: 36px; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th { background: #f6f8fa; text-align: left; }
    th, td { border: 1px solid #d0d7de; padding: 8px 12px; }
    tr:nth-child(even) { background: #f6f8fa; }
    code { background: #f6f8fa; padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
    pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
  </style>
</head>
<body>
  <div id="content"></div>
  <script>
    fetch('architecture.md')
      .then(r => r.text())
      .then(md => document.getElementById('content').innerHTML = marked.parse(md));
  </script>
</body>
</html>
